  Sets up the metadata, page title, favicon link, and viewport configurations.
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="public/assests/LIMS.ico" />

  </body>
</html>
